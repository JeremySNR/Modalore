name: Build Windows preview
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Modalore-Windows-preview
          path: |
            release/*.exe
            release/SHA256SUMS.txt
      - name: Create draft preview release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "$env:GITHUB_REF_NAME" release/*.exe release/SHA256SUMS.txt --draft --prerelease --title "Modalore $env:GITHUB_REF_NAME — Windows preview" --notes-file docs/RELEASE_NOTES.md
